name: Build

on:
  # develop 에 커밋이 push 되면: 이미지 빌드/업로드 (태그: 커밋 해시 앞 10자리)
  push:
    branches: [develop]
    # master 에 태그가 붙으면: 이미지 빌드/업로드 (태그: 그 태그 이름)
    tags: ['**']

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/minj-shalom-frontend

jobs:
  build:
    # 서버(t4g, arm64)용 이미지를 arm64 러너에서 에뮬레이션 없이 네이티브로 빌드
    # (public 저장소에서는 무료. private 으로 바꾸면 사용 시간이 과금되므로 그때는 QEMU 방식 검토)
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 태그가 master 에 속한 커밋을 가리킬 때만 진행 (GitHub 태그 트리거는 브랜치 필터가 없어서 직접 검사)
      - name: Verify tag is on master
        if: github.ref_type == 'tag'
        run: |
          git fetch origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::태그 $GITHUB_REF_NAME 는 master 의 커밋이 아닙니다."
            exit 1
          fi

      - name: Decide image tag
        id: meta
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="${GITHUB_SHA::10}"
          fi
          # 도커 태그로 쓸 수 없는 문자가 있으면 중단
          if ! [[ "$TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::이미지 태그로 쓸 수 없는 값입니다: $TAG"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # 도메인 없이 빌드되면 canonical, sitemap, OG 주소가 localhost 로 박히므로 미리 막음
      - name: Check required repository variables
        env:
          SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "::error::저장소 변수 NEXT_PUBLIC_SITE_URL 이 설정되지 않았습니다. (Settings > Secrets and variables > Actions > Variables)"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          # 패키지를 이 저장소와 연결 (패키지 접근 권한이 저장소 권한을 따르게 됨)
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # NEXT_PUBLIC_* 는 빌드 시점에 박히는 값 (저장소 변수에서 가져옴, 비어 있으면 무시됨)
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_API_ENDPOINT=${{ vars.NEXT_PUBLIC_API_ENDPOINT }}
            NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION=${{ vars.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}
            NEXT_PUBLIC_NAVER_SITE_VERIFICATION=${{ vars.NEXT_PUBLIC_NAVER_SITE_VERIFICATION }}
